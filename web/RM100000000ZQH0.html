 <div class="e2e">
<h1 class="topictitle1">TIRE AND WHEEL<span class="topictitle1"> REMOVAL</span>
</h1>
<div class="subpara" id="RM100000000ZQH0__RM100000000ZQH0_01">
     
    <p class="subpara-subparaName">PROCEDURE</p> 
    <br class="subpara"/>
    <ol class="s1">
<li class="s1Root-s-1">
<p class="s1-heading">REMOVE WHEEL ASSEMBLY</p>
<br class="s1Root-s-1"/>
<ol class="s2" type="a">
<li class="s2Root-s2">
<p class="s2-heading">w/ Wheel Cap:</p>
<br class="s2Root-s2"/>
<ol class="s3" type="i">
<li class="s3Root-s3">
<p class="s3-heading">Remove the wheel cap.</p>
</li>
</ol>
</li>
<li class="s2Root-s2">
<p class="s2-heading">Loosen the axle hub nuts approximately 90°.</p>
</li>
<li class="s2Root-s2">
<p class="s2-heading">Lift up the vehicle and remove the axle hub nuts and wheel assembly.</p>
</li>
</ol>
</li>
</ol>
